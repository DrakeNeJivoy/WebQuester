<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Настройки</title>
    <link rel="stylesheet" th:href="@{/css/settings.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>
<div id="app" :class="theme">
    <header class="header">
        <button class="burger-btn" @click="toggleMenu">
            <i class="fas fa-bars"></i>
        </button>
        <h1>{{ translations.settings }}</h1>
    </header>

    <nav class="burger-menu" :class="{ 'open': isMenuOpen }">
        <ul class="menu-list">
            <li class="menu-item">
                <a th:href="@{/home}" :class="{ active: activeMenu === 'surveys' }" @click="setActiveMenu('surveys')">
                    <i class="fas fa-list"></i>
                    <span class="menu-text">{{ translations.surveys }}</span>
                </a>
            </li>
            <li class="menu-item">
                <a th:href="@{/settings}" :class="{ active: activeMenu === 'settings' }" @click="setActiveMenu('settings')">
                    <i class="fas fa-cog"></i>
                    <span class="menu-text">{{ translations.settings }}</span>
                </a>
            </li>
            <li class="menu-item">
                <a th:href="@{/profile}" :class="{ active: activeMenu === 'profile' }" @click="setActiveMenu('profile')">
                    <i class="fas fa-user"></i>
                    <span class="menu-text">{{ translations.profile }}</span>
                </a>
            </li>
            <li class="menu-item">
                <a th:href="@{/about}" :class="{ active: activeMenu === 'about' }" @click="setActiveMenu('about')">
                    <i class="fas fa-info-circle"></i>
                    <span class="menu-text">{{ translations.about }}</span>
                </a>
            </li>
            <li class="menu-item">
                <a th:href="@{/logout}" :class="{ active: activeMenu === 'logout' }" @click="setActiveMenu('logout')">
                    <i class="fas fa-sign-out-alt"></i>
                    <span class="menu-text">{{ translations.logout }}</span>
                </a>
            </li>
        </ul>
    </nav>

    <div class="content-wrapper">
        <div class="container">
            <h2>{{ translations.settings }}</h2>
            <div class="settings-section">
                <div class="setting-item">
                    <label>{{ translations.theme }}</label>
                    <div class="theme-toggle">
                        <span :class="{ active: theme === 'light' }" @click="setTheme('light')">{{ translations.light }}</span>
                        <span :class="{ active: theme === 'dark' }" @click="setTheme('dark')">{{ translations.dark }}</span>
                    </div>
                </div>
                <div class="setting-item">
                    <label>{{ translations.language }}</label>
                    <select v-model="language" @change="setLanguage">
                        <option value="ru">{{ translations.russian }}</option>
                        <option value="en">{{ translations.english }}</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p>Ису-23</p>
    </footer>
</div>

<script src="/js/settings.js"></script>
</body>
</html>
