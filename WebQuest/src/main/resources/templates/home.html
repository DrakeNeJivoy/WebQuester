<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Главная страница</title>
    <link rel="stylesheet" th:href="@{/css/home.css}">
    <!-- Подключаем Font Awesome для иконок -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<header class="header">
    <a th:href="@{/menu}" class="menu-link">Меню</a>
    <h1>Панель управления</h1>
    <a class="logout-btn" th:href="@{/logout}">Выйти</a>
</header>

<div class="content-wrapper">
    <div class="container">
        <div class="action-buttons">
            <a th:href="@{/home-create-survey}">
                <button>Создать анкету</button>
            </a>
            <a th:href="@{/profile}">
                <button>Профиль</button>
            </a>
        </div>

        <div class="survey-section">
            <h2>Список анкет</h2>
            <div class="survey-list">
                <div class="survey-item" th:each="survey : ${surveys}">
                    <span th:text="${survey.title}">Название анкеты</span>
                    <div class="survey-actions">
                        <a th:href="@{'/survey/' + ${survey.id}}" class="btn-pass">Пройти</a>
                        <div class="dropdown" th:if="${currentUser != null && survey.user != null && (currentUser.isadmin() || currentUser.id.longValue() == survey.user.id.longValue())}">
                            <button class="btn-options" type="button">
                                <i class="fas fa-ellipsis-v"></i>
                            </button>
                            <ul class="dropdown-menu">
                                <li>
                                    <a class="dropdown-item" th:href="@{'/survey/edit/' + ${survey.id}}">
                                        <i class="fas fa-edit"></i> Редактировать
                                    </a>
                                </li>
                                <li>
                                    <form th:action="@{'/surveys/survey/delete/' + ${survey.id}}" method="post" style="display: none;" th:id="'delete-form-' + ${survey.id}">
                                    </form>
                                    <a class="dropdown-item delete-link" href="#" th:data-form-id="'delete-form-' + ${survey.id}" onclick="return confirm('Вы уверены, что хотите удалить эту анкету?')">
                                        <i class="fas fa-trash-alt"></i> Удалить
                                    </a>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<footer>
    <p>Ису-23</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const dropdowns = document.querySelectorAll('.dropdown');

        dropdowns.forEach(dropdown => {
            const button = dropdown.querySelector('.btn-options');
            const menu = dropdown.querySelector('.dropdown-menu');

            button.addEventListener('click', function (event) {
                event.stopPropagation();
                // Закрываем все другие открытые меню
                document.querySelectorAll('.dropdown-menu.show').forEach(openMenu => {
                    if (openMenu !== menu) {
                        openMenu.classList.remove('show');
                    }
                });
                // Переключаем текущее меню
                menu.classList.toggle('show');
            });

            // Закрываем меню при клике вне его
            document.addEventListener('click', function (event) {
                if (!dropdown.contains(event.target)) {
                    menu.classList.remove('show');
                }
            });
        });

        // Обработчик для ссылок удаления
        document.querySelectorAll('.delete-link').forEach(link => {
            link.addEventListener('click', function (event) {
                event.preventDefault();
                if (confirm('Вы уверены, что хотите удалить эту анкету?')) {
                    const formId = this.getAttribute('data-form-id');
                    const form = document.getElementById(formId);
                    form.submit();
                }
            });
        });
    });
</script>
</body>
</html>
