<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Главная страница</title>
    <link rel="stylesheet" th:href="@{/css/home.css}">
</head>
<body>
<header class="header">
    <h1>Панель управления</h1>
    <a class="logout-btn" th:href="@{/logout}">Выйти</a>
</header>

<div class="content-wrapper">
    <div class="container">
        <div class="action-buttons">
            <a th:href="@{/home-create-survey}">
                <button>Создать анкету</button>
            </a>
            <a th:href="@{/profile}">
                <button>Профиль</button>
            </a>
        </div>

        <div class="survey-section">
            <h2>Список анкет</h2>
            <div class="survey-list">
                <div class="survey-item" th:each="survey : ${surveys}">
                    <span th:text="${survey.title}">Название анкеты</span>
                    <div class="survey-actions">
                        <a th:href="@{'/survey/' + ${survey.id}}" class="btn-pass">Пройти</a>
                        <div class="dropdown" th:if="${currentUser != null && survey.user != null && (currentUser.isadmin() || currentUser.id.longValue() == survey.user.id.longValue())}">
                            <button class="btn-options" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                                ...
                            </button>
                            <ul class="dropdown-menu">
                                <li>
                                    <a class="dropdown-item" th:href="@{'/survey/edit/' + ${survey.id}}">Редактировать</a>
                                </li>
                                <li>
                                    <form th:action="@{'/surveys/survey/delete/' + ${survey.id}}" method="post" style="display: inline;">
                                        <button type="submit" class="dropdown-item" onclick="return confirm('Вы уверены, что хотите удалить эту анкету?')">Удалить</button>
                                    </form>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<footer>
    <p>Ису-23</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
