<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Результат анкеты</title>
    <link rel="stylesheet" th:href="@{/css/submission-result.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>
<div id="app"
     data-questions="${questions}"
     data-question-correctness="${questionCorrectness}">
    <header class="header">
        <button class="burger-btn" @click="toggleMenu">
            <i class="fas fa-bars"></i>
        </button>
        <h1>Результаты анкеты</h1>
    </header>

    <nav class="burger-menu" :class="{ 'open': isMenuOpen }">
        <ul class="menu-list">
            <li class="menu-item">
                <a th:href="@{/home}" :class="{ active: activeMenu === 'surveys' }" @click="setActiveMenu('surveys')">
                    <i class="fas fa-list"></i>
                    <span class="menu-text">Анкеты</span>
                </a>
            </li>
            <li class="menu-item">
                <a th:href="@{/settings}" :class="{ active: activeMenu === 'settings' }" @click="setActiveMenu('settings')">
                    <i class="fas fa-cog"></i>
                    <span class="menu-text">Настройки</span>
                </a>
            </li>
            <li class="menu-item">
                <a th:href="@{/profile}" :class="{ active: activeMenu === 'profile' }" @click="setActiveMenu('profile')">
                    <i class="fas fa-user"></i>
                    <span class="menu-text">Профиль</span>
                </a>
            </li>
            <li class="menu-item">
                <a th:href="@{/about}" :class="{ active: activeMenu === 'about' }" @click="setActiveMenu('about')">
                    <i class="fas fa-info-circle"></i>
                    <span class="menu-text">О нас</span>
                </a>
            </li>
            <li class="menu-item">
                <a th:href="@{/logout}" :class="{ active: activeMenu === 'logout' }" @click="setActiveMenu('logout')">
                    <i class="fas fa-sign-out-alt"></i>
                    <span class="menu-text">Выйти</span>
                </a>
            </li>
        </ul>
    </nav>

    <div class="content-wrapper">
        <div class="container">
            <div class="summary-card" id="summaryCard">
                <h3>Общий результат</h3>
                <p>Процент правильных ответов: <span id="percentageDisplay" th:text="${percentageCorrect} + '%'">{{ percentageCorrect }}%</span></p>
            </div>

            <div th:each="question : ${questions}" class="question-card">
                <h3 th:text="${question?.text ?: 'Вопрос не указан'}"></h3>
                <p th:if="${question != null and questionCorrectness != null and questionCorrectness.containsKey(question.id) and allAnswerOptions != null and allAnswerOptions.get(question.id) != null and allAnswerOptions.get(question.id).?[status == 2].size() > 0}"
                   class="question-result"
                   th:classappend="${questionCorrectness.get(question.id) ? 'question-correct' : 'question-incorrect'}">
                    Ответ на вопрос: <span th:text="${questionCorrectness.get(question.id) ? 'Правильно' : 'Неправильно'}"></span>
                </p>
                <ul>
                    <li th:each="option : ${allAnswerOptions != null and allAnswerOptions.get(question.id) != null ? allAnswerOptions.get(question.id) : {}}"
                        th:class="${userSelectedAnswerIds != null and userSelectedAnswerIds.containsKey(question.id) and userSelectedAnswerIds.get(question.id) != null and option != null and userSelectedAnswerIds.get(question.id).contains(option.id)} ? 'user-choice' : ''"
                        th:style="${option != null and option.status == 2 and allAnswerOptions != null and allAnswerOptions.get(question.id) != null and allAnswerOptions.get(question.id).?[status == 2].size() > 0} ? 'font-weight: bold; color: #28A745;' : ''">
                        <span class="option-text">
                            <i th:if="${option != null and option.status == 2 and allAnswerOptions != null and allAnswerOptions.get(question.id) != null and allAnswerOptions.get(question.id).?[status == 2].size() > 0}" class="fas fa-check correct-icon"></i>
                            <i th:if="${userSelectedAnswerIds != null and userSelectedAnswerIds.containsKey(question.id) and userSelectedAnswerIds.get(question.id) != null and option != null and userSelectedAnswerIds.get(question.id).contains(option.id)}" class="fas fa-user-check selected-icon"></i>
                            <i th:if="${userSelectedAnswerIds != null and userSelectedAnswerIds.containsKey(question.id) and userSelectedAnswerIds.get(question.id) != null and option != null and userSelectedAnswerIds.get(question.id).contains(option.id) and option.status != 2 and allAnswerOptions != null and allAnswerOptions.get(question.id) != null and allAnswerOptions.get(question.id).?[status == 2].size() > 0}" class="fas fa-times incorrect-icon"></i>
                            <span th:text="${option?.text ?: 'Вариант ответа не указан'}"></span>
                        </span>
                        <span th:if="${option != null and option.status == 2 and allAnswerOptions != null and allAnswerOptions.get(question.id) != null and allAnswerOptions.get(question.id).?[status == 2].size() > 0}" class="correct-answer"> </span>
                        <span th:if="${userSelectedAnswerIds != null and userSelectedAnswerIds.containsKey(question.id) and userSelectedAnswerIds.get(question.id) != null and option != null and userSelectedAnswerIds.get(question.id).contains(option.id)}" class="selected-answer"> </span>
                        <span th:if="${userSelectedAnswerIds != null and userSelectedAnswerIds.containsKey(question.id) and userSelectedAnswerIds.get(question.id) != null and option != null and userSelectedAnswerIds.get(question.id).contains(option.id) and option.status != 2 and allAnswerOptions != null and allAnswerOptions.get(question.id) != null and allAnswerOptions.get(question.id).?[status == 2].size() > 0}" class="incorrect-answer"> </span>
                    </li>
                </ul>
            </div>
            <a th:href="@{/home}" class="back-button">Вернуться на главную</a>
        </div>
    </div>

    <footer>
        <p>Ису-23</p>
    </footer>
</div>

<script src="/js/submission-result.js"></script>
</body>
</html>
